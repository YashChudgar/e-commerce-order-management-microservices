spring.config.import=optional:file:../.env[.properties]

spring.application.name=api-gateway
server.port=8080

# Customer Service
spring.cloud.gateway.server.webmvc.routes[0].id=customer-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/customers/**

# Product Service
spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/products/**

# Order Service
spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/orders/**

# Customer Swagger
spring.cloud.gateway.server.webmvc.routes[3].id=customer-swagger
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/customer/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=SetPath=/v3/api-docs

# Product Swagger
spring.cloud.gateway.server.webmvc.routes[4].id=product-swagger
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/product/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=SetPath=/v3/api-docs

# Order Swagger
spring.cloud.gateway.server.webmvc.routes[5].id=order-swagger
spring.cloud.gateway.server.webmvc.routes[5].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/order/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=SetPath=/v3/api-docs

# Auth Swagger
spring.cloud.gateway.server.webmvc.routes[7].id=auth-swagger
spring.cloud.gateway.server.webmvc.routes[7].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/auth/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=SetPath=/v3/api-docs

# Authentication Service
spring.cloud.gateway.server.webmvc.routes[6].id=auth-service
spring.cloud.gateway.server.webmvc.routes[6].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/auth/**

# Swagger UI
springdoc.swagger-ui.urls[0].name=Customer Service
springdoc.swagger-ui.urls[0].url=/customer/v3/api-docs

springdoc.swagger-ui.urls[1].name=Product Service
springdoc.swagger-ui.urls[1].url=/product/v3/api-docs

springdoc.swagger-ui.urls[2].name=Order Service
springdoc.swagger-ui.urls[2].url=/order/v3/api-docs

springdoc.swagger-ui.urls[3].name=Auth Service
springdoc.swagger-ui.urls[3].url=/auth/v3/api-docs

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000